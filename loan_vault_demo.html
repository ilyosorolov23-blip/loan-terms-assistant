<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Loan Vault — Scoped Terms Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1220;
  --ink-2:#101a2c;
  --ink-3:#16243b;
  --paper:#f6f1e4;
  --paper-dim:#ece4d0;
  --gold:#c9a15d;
  --teal:#3a8f77;
  --teal-dim:#245c4c;
  --rust:#c4703a;
  --rust-dim:#7a4223;
  --slate:#8a9ab3;
  --slate-dim:#5b6a85;
  --line:rgba(201,161,93,0.18);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--font-body);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(201,161,93,0.05), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(58,143,119,0.06), transparent 45%);
}
#root{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--ink-2), var(--ink));
  flex-shrink:0;
}
.seal-mark{
  width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:16px;color:var(--gold);
  flex-shrink:0;position:relative;
}
.seal-mark::after{
  content:'';position:absolute;inset:-5px;border-radius:50%;
  border:1px dashed rgba(201,161,93,0.35);
}
.topbar h1{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.2px;color:var(--paper)}
.topbar .sub{font-size:11.5px;color:var(--slate);margin-top:1px;font-family:var(--font-mono);letter-spacing:.3px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.gate-chip{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:10.5px;color:var(--slate);
  border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 8px;
}
.gate-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal)}

/* ---------- layout ---------- */
.layout{flex:1;display:flex;min-height:0}
.sidebar{
  width:290px;flex-shrink:0;border-right:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
  overflow-y:auto;padding:18px 14px 20px;
}
.sidebar-label{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--slate-dim);padding:0 6px;margin-bottom:10px;
}
.doc-card{
  border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;
  cursor:pointer;transition:all .15s ease;background:rgba(255,255,255,0.015);
  position:relative;overflow:hidden;
}
.doc-card:hover{border-color:rgba(201,161,93,0.4);background:rgba(201,161,93,0.04)}
.doc-card.active{
  border-color:var(--gold);background:rgba(201,161,93,0.08);
  box-shadow:inset 0 0 0 1px rgba(201,161,93,0.15);
}
.doc-card .flag{font-size:20px;margin-bottom:6px;display:block}
.doc-card .bank{font-family:var(--font-display);font-size:14.5px;color:var(--paper);line-height:1.25;margin-bottom:3px}
.doc-card .meta{font-family:var(--font-mono);font-size:10px;color:var(--slate-dim);letter-spacing:.3px}
.doc-card.active .meta{color:var(--gold)}

.about-box{
  margin-top:18px;padding:13px 14px;border-radius:10px;
  border:1px solid var(--line);background:rgba(58,143,119,0.05);
  font-size:11.5px;line-height:1.55;color:var(--slate);
}
.about-box b{color:var(--paper);font-weight:600}
.about-box .rule{display:flex;gap:7px;align-items:flex-start;margin-top:7px}
.about-box .rule .n{color:var(--gold);font-family:var(--font-mono);flex-shrink:0}

/* ---------- chat column ---------- */
.chat-col{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-scroll{flex:1;overflow-y:auto;padding:22px 0 10px}
.chat-inner{max-width:720px;margin:0 auto;padding:0 24px}

.doc-banner{
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px;
  background:linear-gradient(135deg, rgba(201,161,93,0.06), rgba(58,143,119,0.04));
  display:flex;align-items:center;gap:14px;
}
.doc-banner .flag-big{font-size:30px}
.doc-banner .title{font-family:var(--font-display);font-size:17px;color:var(--paper)}
.doc-banner .desc{font-size:12px;color:var(--slate);margin-top:2px;font-family:var(--font-mono)}

.empty-state{text-align:center;padding:30px 10px 10px;color:var(--slate)}
.empty-state .icon{font-size:30px;margin-bottom:10px;opacity:.7}
.empty-state p{font-size:13px;max-width:420px;margin:6px auto 0;line-height:1.6}

.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{
  font-family:var(--font-mono);font-size:11.5px;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);color:var(--slate);cursor:pointer;transition:.15s;background:transparent;
}
.chip:hover{border-color:var(--gold);color:var(--paper)}
.chip.type-ok{border-color:rgba(58,143,119,0.35)}
.chip.type-bad{border-color:rgba(196,112,58,0.35)}

.msg-row{display:flex;margin-bottom:18px}
.msg-row.user{justify-content:flex-end}
.bubble{
  max-width:78%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.55;
}
.msg-row.user .bubble{
  background:var(--teal-dim);color:var(--paper);border-bottom-right-radius:4px;
}
.msg-row.assistant .bubble-wrap{max-width:86%}
.msg-row.assistant .bubble{
  background:var(--ink-3);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--paper);
}
.msg-row.assistant .bubble.refused{border-color:rgba(196,112,58,0.4);background:rgba(196,112,58,0.06)}
.msg-row.assistant .bubble.blocked{border-color:rgba(196,112,58,0.55);background:rgba(196,112,58,0.09)}
.msg-row.assistant .bubble.grounded{border-color:rgba(58,143,119,0.35)}

.stamp{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 9px 4px 7px;border-radius:5px;border:1px solid;
  animation:stampIn .32s cubic-bezier(.2,1.4,.4,1);
}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
.stamp.ok{color:var(--teal);border-color:var(--teal-dim);background:rgba(58,143,119,0.08)}
.stamp.warn{color:var(--rust);border-color:var(--rust-dim);background:rgba(196,112,58,0.1)}

.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.cite-chip{
  font-family:var(--font-mono);font-size:10.5px;color:var(--gold);border:1px solid rgba(201,161,93,0.35);
  border-radius:5px;padding:3px 8px;cursor:pointer;background:rgba(201,161,93,0.05);transition:.15s;
}
.cite-chip:hover{background:rgba(201,161,93,0.14)}
.source-card{
  margin-top:9px;padding:11px 13px;border-radius:8px;background:var(--paper);color:#2a2318;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.6;
  border-left:3px solid var(--gold);position:relative;
}
.source-card .pg{font-weight:700;color:var(--rust-dim);margin-bottom:4px;display:block;font-family:var(--font-mono)}

.pipeline{
  display:flex;align-items:center;gap:0;margin:6px 0 16px;font-family:var(--font-mono);font-size:10.5px;
}
.pstep{display:flex;align-items:center;gap:6px;color:var(--slate-dim);padding:5px 9px;border-radius:20px;transition:.25s}
.pstep .dot{width:6px;height:6px;border-radius:50%;background:var(--slate-dim);flex-shrink:0;transition:.25s}
.pstep.active{color:var(--gold)}.pstep.active .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 1s infinite}
.pstep.done{color:var(--teal)}.pstep.done .dot{background:var(--teal)}
.pstep.blocked{color:var(--rust)}.pstep.blocked .dot{background:var(--rust)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pline{width:20px;height:1px;background:var(--line);flex-shrink:0}

.input-bar{
  border-top:1px solid var(--line);padding:14px 24px 18px;
  background:linear-gradient(180deg, transparent, var(--ink-2) 40%);
}
.input-inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.input-inner textarea{
  flex:1;background:var(--ink-3);border:1px solid var(--line);border-radius:12px;
  color:var(--paper);padding:11px 14px;font-family:var(--font-body);font-size:14px;
  resize:none;line-height:1.4;max-height:120px;
}
.input-inner textarea:focus{outline:none;border-color:var(--gold)}
.input-inner textarea::placeholder{color:var(--slate-dim)}
.send-btn{
  background:var(--gold);color:var(--ink);border:none;border-radius:10px;width:42px;height:42px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:.15s;
}
.send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 12px rgba(201,161,93,0.3)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.disclaimer{max-width:720px;margin:8px auto 0;font-size:10.5px;color:var(--slate-dim);text-align:center;font-family:var(--font-mono)}

.typing-dots{display:inline-flex;gap:4px;padding:2px 0}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--slate);animation:bounce 1.1s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(201,161,93,0.18);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:760px){
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:20;transform:translateX(-100%);transition:.25s;box-shadow:10px 0 30px rgba(0,0,0,.4)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex !important}
  .bubble{max-width:92%}
}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--paper);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer}

</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="seal-mark">LT</div>
    <div>
      <h1>The Loan Vault</h1>
      <div class="sub">scoped terms assistant · retrieval + two security gates</div>
    </div>
    <div class="topbar-right">
      <div class="gate-chip"><span class="gate-dot"></span>scope guard</div>
      <div class="gate-chip"><span class="gate-dot"></span>grounding guard</div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="chat-col">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="chatInner">
          <div id="bannerHost"></div>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-inner">
          <textarea id="msgInput" rows="1" placeholder="Ask about this contract's rate, fees, penalties, eligibility…"></textarea>
          <button class="send-btn" id="sendBtn" title="Send">➤</button>
        </div>
        <div class="disclaimer">Answers are generated from the document above and may still contain errors — always verify against the original PDF before relying on it.</div>
      </div>
    </div>
  </div>
</div>

....................................................................................................................................... 12\n57. Language (For Quebec Only) .................................................................................................................................................12", "page": 2}, {"text": "12421 P-2022/06\nPage 3 of 15\nCIBC Personal Loan: Terms and Conditions\nPart V – Definitions .......................................................................................................................................................................... 12\nEquivalent Interest Rates ................................................................................................................................................................. 14\nPrivacy Disclosure..............................................................................................................................................................................15\nWhat is personal information? .......................................................................................................................", "page": 3}, {"text": "..................................................................................................................................................... 15\nWhat personal information does CIBC collect? .............................................................................................................................15\nHow does CIBC use and share personal information? .................................................................................................................. 15\nHow does CIBC protect personal information? .............................................................................................................................15\nWhat are my privacy choices? ........................................................................................................", "page": 3}, {"text": "rivacy choices? ...................................................................................................................................................... 15\nQuestions?....................................................................................................................................................................................15", "page": 3}, {"text": "12421 P-2022/06\nPage 4 of 15\nCIBC Personal Loan: Terms and Conditions\nCIBC Personal Loan Agreement: Terms and Conditions\nThis Agreement applies to any money we lend you under your loan. This Agreement should be read together with your CIBC Personal Loan \nBorrowing Application and the Statement of Disclosure. Signing the CIBC Personal Loan Borrowing Application, or when CIBC advances the \nproceeds of your loan, means that you received, read, understood and agree to this Agreement.\nPart I – Terms and Conditions for Your Loan\n1. Overview\nThis Agreement, the CIBC Personal Loan Borrowing Application and the Statement of Disclosure describe the terms applicable to \nborrowings you make from CIBC under your loan. Your loan may be secured on personal or real property (in Quebec, movable or \nimmovab", "page": 4}, {"text": "ou make from CIBC under your loan. Your loan may be secured on personal or real property (in Quebec, movable or \nimmovable property) you own or may be unsecured. You will pay (in Canadian dollars) all, or any part, of your debt when it is due or \nimmediately when we demand it.\n2. Promise to Repay\nYou will pay (in Canadian dollars) all amounts required by this Agreement in full, without delay (even when normal mail service is \ndisrupted).\n3. Advancing Loan Funds\nThe proceeds of your loan will be advanced on the date shown as the Date Funds Disbursed on the Statement of Disclosure. If \napplicable, we will advance funds to the account specified in the CIBC Personal Borrowing Application.\nIf your financial circumstances or credit information changes prior to the date on which we advance your l", "page": 4}, {"text": "Application.\nIf your financial circumstances or credit information changes prior to the date on which we advance your loan, we may, without prior \nnotice to you, cancel your loan.\n4. Access to, and Use of, Funds\nYou will only use your loan for personal, household or family purposes. You must not use your loan:\n● for any business that you own or in which you have any interest; or\n● for any illegal or fraudulent purposes.\nAlso, you will not make payments on your loan using funds borrowed from CIBC or drawn on any other CIBC credit facility or credit \naccount.\n5. Interest Payments\nUntil all amounts owing under this Agreement are paid in full, you must pay interest on the loan at the interest rate set out in the \nStatement of Disclosure (which will be either a fixed rate or a variable rate) b", "page": 4}, {"text": "an at the interest rate set out in the \nStatement of Disclosure (which will be either a fixed rate or a variable rate) both before and after any of the following events:\n● we demand payment;\n● the maturity date;\n● default;\n● you have legal action taken against you, your property or assets; and\n● any court judgment we obtain against you.\nIf your payments are in arrears, you can contact us at any time to find out the amount of interest in arrears.\nThe interest rate compounded semi-annually not in advance that is equivalent to the interest rate set out in the Statement of Disclosure \nis set out in the table in the Equivalent Interest Rates section of this Agreement.\n6. Interest Rate\nWe will not pay interest on any credit balance in your loan.\nYou will pay interest on all amounts outstanding o", "page": 4}, {"text": "est Rate\nWe will not pay interest on any credit balance in your loan.\nYou will pay interest on all amounts outstanding on your loan (including unpaid interest, fees, charges, etc.) at the annual interest rate \nset out in the Statement of Disclosure, which is either a fixed rate or a variable rate.\nThe interest rate will change automatically whenever the prime rate changes. We may change our prime rate from time to time without \nnotice to you. You can find out what the prime rate is on any given day by calling CIBC toll free at 1 877 465-CIBC (2422), by going \nto any CIBC branch in Canada or at www.cibc.com. If there is a need to prove the prime rate in effect at any time, you agree that a \ncertificate from us stating the rate will be conclusive evidence of the rate in effect at that time.", "page": 4}, {"text": "you agree that a \ncertificate from us stating the rate will be conclusive evidence of the rate in effect at that time.\nWe may also, without prior notice, change the adjustment factor (as shown on the Statement of Disclosure) which is added to our \nprime rate to determine the interest rate on your loan, on a permanent or temporary basis. If we change the adjustment factor, we will \nsend you notice as required by law and at the same time let you know when the change became effective.", "page": 4}, {"text": "12421 P-2022/06\nPage 5 of 15\nCIBC Personal Loan: Terms and Conditions\n7. How we Calculate Interest\nInterest accrues from the day the loan is advanced to you. We calculate interest daily on the principal balance owing on your loan in the \nfollowing way:\n● we multiply the outstanding principal balance under your loan by a daily interest factor based on the interest rate in effect on that \nday.\n● we add together all of the interest charges for each day in the statement period to determine the total interest that has accrued in \nthe particular month.\nInterest will be compounded monthly. This means that unpaid interest from the immediately preceding month will be added to the \nbalance of your loan each month. We may choose to charge interest on interest.\n8. Fees and Charges\nYou must pay, and we", "page": 5}, {"text": "balance of your loan each month. We may choose to charge interest on interest.\n8. Fees and Charges\nYou must pay, and we may add to the principal amount owing under your loan, any fees, charges and any other amounts you may owe \nus under this Agreement, including:\n● insurance premiums (if you purchased creditor insurance for your loan);\n● the fees, charges and non-interest charges set out in the Statement of Disclosure;\n● any expenses we incur in responding to any third party legal notice or document; and\n● any fees, costs and expenses related to processing, surveys, preparing, reviewing, signing and registering (electronic or otherwise) \nof any documents required to register any mortgage/charge against your real or personal property (in Quebec, an immovable or \nmovable hypothec), includin", "page": 5}, {"text": "ster any mortgage/charge against your real or personal property (in Quebec, an immovable or \nmovable hypothec), including any amendments, renewals, transfers, discharges, other registrations, government fees, legal fees, \nand service provider fees. You will pay these amounts whether the registration, amendment, renewal, transfer or discharge of our \nmortgage/charge is prepared by your lawyer or notary, by our lawyers, notaries or service providers, or by us.\nIf you fail to make a payment when due, or fail to comply with any obligation in this Agreement or in any security you have given us, we \nmay charge you to recover any costs, including legal fees and expenses (to the fullest extent permitted by law), we reasonably incur for \nany action we take to collect the amount you owe us or to enf", "page": 5}, {"text": "fullest extent permitted by law), we reasonably incur for \nany action we take to collect the amount you owe us or to enforce any obligation or realize on or protect any security we hold for your \nloan. We may add these charges to the principal amount owing under your loan.\nWe may change our fees and charges at any time. We will provide you with notice of those pricing or fee changes, as required by law. \nOther fees, charges, costs, and insurance premiums levied by third parties may also change from time to time.\n9. Payments\nYou will make regular payments during the term of the loan with the payment frequency specified in the Statement of Disclosure:\n● If the Statement of Disclosure requires regular payments of \"interest only\": you will make regular payments of interest on the \noutstanding", "page": 5}, {"text": "Disclosure requires regular payments of \"interest only\": you will make regular payments of interest on the \noutstanding principal balance of your loan, plus, if you have elected insurance coverage, the insurance premium for the payment \nperiod (calculated as set out in Section 16).\n● If the Statement of Disclosure requires payments of a certain amount \"plus interest\": you will make regular payments of that \namount, plus interest on the outstanding principal balance of your loan, plus, if you have elected insurance coverage, the insurance \npremium for the payment period (calculated as set out in Section 16).\n● If the Statement of Disclosure requires regular payments of a fixed amount: you will make regular payments equal to that amount, \nplus, if you have elected insurance coverage, an addi", "page": 5}, {"text": "ixed amount: you will make regular payments equal to that amount, \nplus, if you have elected insurance coverage, an additional amount for insurance premiums (calculated as set out in Section 16) over \nthe term of your loan.\nInterest due on a regular payment date is calculated from and including the previous regular payment date to, but not including, the \ncurrent regular payment date.\nFirst regular payment only: The Statement of Disclosure will show the date when your first regular payment is due. Interest due on the \nfirst regular payment date is calculated from and including the date funds are advanced to, but not including, the first regular payment \ndate. If the regular payment amount is not sufficient to cover such interest, plus, if applicable, the insurance premium, the excess will", "page": 5}, {"text": "ar payment amount is not sufficient to cover such interest, plus, if applicable, the insurance premium, the excess will be \nadded to the principal balance of the loan.\nNumber of regular payments you must make: The number of payments you must make is determined by the date of your first payment \nand the term of your loan. This number may not be exactly equal to the term of your loan divided by the frequency of your payments. \nFor example, if you are making monthly payments and the term of your loan is 12.3 months, the number of payments you must make \nwill be either 12 or 13. To see the number of payments you must make, please refer to “Number of payments” in your Statement of \nDisclosure.\nThe total amount owed on your loan includes all amounts you owe on your loan, interest, insurance prem", "page": 5}, {"text": "t of \nDisclosure.\nThe total amount owed on your loan includes all amounts you owe on your loan, interest, insurance premiums, taxes and fees.\nYou must pay all amounts owing to us on time, including whether or not your method of payment is through pre-authorized debit.\nIt will not diminish our rights if we accept late, partial or other payments not made in accordance with this Agreement or if you mark a \ncheque or money order as being full payment when it is not.", "page": 5}, {"text": "12421 P-2022/06\nPage 6 of 15\nCIBC Personal Loan: Terms and Conditions\n10. Balance Owing at Maturity\nThe \"Balance owing at maturity\" shown on your Statement of Disclosure has been calculated assuming:\n● that you will make all future payments when due;\n● if you elected insurance coverage, that insurance premiums will not change; and\n● if you have a variable rate loan with fixed amount payments, that your interest rate will not change.\nIf any of these assumptions is not correct, the balance owing at maturity of your loan may change.\n11. Demand\nWe may at any time, without prior notice to you and for any reason, demand immediate payment of any amounts outstanding under \nyour loan or this Agreement. A variable rate loan with fixed regular payments, will become due and payable immediately if on a", "page": 6}, {"text": "oan or this Agreement. A variable rate loan with fixed regular payments, will become due and payable immediately if on any \nregular payment date except the first regular payment date the unpaid interest accrued to that date is greater than the fixed regular \npayment. If we demand payment of your loan, or if your loan becomes due and payable, then you will immediately pay all amounts \nowing on your loan including outstanding principal, interest, insurance premiums, and any other charges and fees.\n12. Methods of Making Payments\nYou can make payments as follows:\n● authorizing us to debit a CIBC account. If the account is a joint account then all account holders must authorize withdrawals \nfrom the account for payment of your loan. We will automatically withdraw from that account, on or after", "page": 6}, {"text": "e withdrawals \nfrom the account for payment of your loan. We will automatically withdraw from that account, on or after each regular payment \ndate,the regular payment amount, and to withdraw from that account any overdue amount at any time. You and any joint \naccount holder must sign a separate authorization for payments to be made this way; or\n● any other way we deem acceptable.\n13. How we Apply Payments\nPrior to default, we will apply payments made towards your loan first to non-interest charges due if any, then to accrued interest due, \nand then to the outstanding principal amount of your loan.\nYou may make a payment that is greater than your regular payment and other amounts you are required to pay. You may also make \nadditional payments on your loan at any time. However, after an addi", "page": 6}, {"text": "amounts you are required to pay. You may also make \nadditional payments on your loan at any time. However, after an additional payment, unless other arrangements have been made, you \nmust continue to make regular payments as before until your loan is repaid in full. Any additional payments you make will be applied to \nreduce the principal balance of your loan.\n14. Reporting Fraud\nYou must notify us immediately about any circumstance in which one might reasonably conclude that a fraud may occur in relation to \nyour loan.\n15. Multiple Borrowers\nIf there is more than one borrower under your loan, each borrower is individually, solidarily (in Quebec) and fully responsible for \nmeeting all obligations in this Agreement (for example, this means each borrower is fully responsible for the entire d", "page": 6}, {"text": "meeting all obligations in this Agreement (for example, this means each borrower is fully responsible for the entire debt). Each borrower \nmay give us instructions, borrow money and make decisions regarding the Agreement without the consent of any other borrower and \nsuch instructions and decisions will be binding on all borrowers.\nIf there is a dispute between borrowers, we may accept payments made against the loan, and we may require joint instructions or a \ncourt order.\n16. Insurance Coverage\nIf you have elected to purchase CIBC Creditor Insurance for your loan, this section applies.\nInsurance premiums are calculated and accumulated daily using (i) your age on the date the loan funds are advanced, (ii) the applicable \npremium rate from the rate table in the certificate of insurance yo", "page": 6}, {"text": "te the loan funds are advanced, (ii) the applicable \npremium rate from the rate table in the certificate of insurance you receive upon purchase, and (iii) for Life Insurance, the daily \noutstanding principal balance of the loan, or for Disability Insurance and CIBC Payment Protector Insurance (disability + job loss \ncoverage), the loan’s regular payment amount of principal and interest, plus any applicable insurance premiums (plus applicable taxes).\nIf your loan is repayable by fixed amount payments, and your insurance coverage includes life insurance, the following applies: Each \nfixed amount payment will include an amount for insurance premiums calculated based on average insurance premiums over the \nterm of your loan. This is the amount that will appear on your Statement of Disclosure.", "page": 6}, {"text": "ge insurance premiums over the \nterm of your loan. This is the amount that will appear on your Statement of Disclosure. Notwithstanding that your payment amount \nis fixed, your actual insurance premiums will vary over the term of your loan according to the balance of your loan owing. As a result, \nthe portion of each fixed amount payment applied to insurance premiums, and the portion of each fixed amount payment applied to \nprincipal and interest will vary over the term of the loan. The “Balance owing at maturity” shown on the Statement of Disclosure is an \nestimate calculated based on average insurance premiums over the term of the loan.\nIf purchased, you may cancel CIBC Creditor Insurance for your loan at any time.", "page": 6}, {"text": "Creditor Insurance for your loan at any time.", "page": 6}, {"text": "12421 P-2022/06\nPage 7 of 15\nCIBC Personal Loan: Terms and Conditions\n17. Renewal Agreement\nIf your loan is not paid in full by the last regular payment during the term of your loan, we may offer to amend the terms and \nconditions of your loan by sending you a renewal agreement which will extend the term of your loan, and which may change, among \nother things, your interest rate, your regular payment amount, payment frequency, the amortization period of your loan and the type \nof payments required (blended, interest only or principal plus interest).\nAccrued interest to the renewal date may be added to your loan amount. Unless otherwise stated in the renewal agreement, all other \nterms and conditions of your loan will remain the same. If you do not pay the balance owing at the end of the te", "page": 7}, {"text": "other \nterms and conditions of your loan will remain the same. If you do not pay the balance owing at the end of the term and have not \nnotified us before the end of the term that you do not accept our renewal offer, you will be deemed to have accepted our offer on the \nterms and conditions set out in the renewal agreement. If you give us notice before the end of the term that you do not accept our \noffer, then by the end of the term you will repay all amounts owing including outstanding principal, interest (insurance premiums) and \nother applicable charges. For registration purposes, you agree from time to time to sign any documents relating to such renewal.\n18. Assumptions and Transfers\nYou cannot transfer your loan without CIBC’s consent, and the loan cannot be assumed by any other per", "page": 7}, {"text": "ions and Transfers\nYou cannot transfer your loan without CIBC’s consent, and the loan cannot be assumed by any other person without CIBC’s consent.\nPart II – Security Terms\n19. General\nIf you have agreed in your CIBC Personal Loan Borrowing Application to give security over any personal or real property (in Quebec, \nmovable or immovable property) (the specific property identified in such application being referred to as the “collateral”), the provisions \nin this Part will apply to the particular security. If security in the collateral must comply with Quebec law, then you must sign the \nnecessary form of Quebec hypothec. If the collateral is not governed by Quebec law and is real property, then you must sign our \nstandard form of mortgage/charge. If the collateral is personal property, the", "page": 7}, {"text": "is real property, then you must sign our \nstandard form of mortgage/charge. If the collateral is personal property, then the security will be created under the provisions of this \nPart, unless some additional security document is required in order to provide us with , but if you do not we may do so and \ncharge the premiums to your loan; and\n● you will maintain the collateral in a good condition, but if you do not we have the right to make any necessary repairs and to", "page": 7}, {"text": "l maintain the collateral in a good condition, but if you do not we have the right to make any necessary repairs and to \ncharge your loan with the cost of those repairs.\n24. Enforcement of Security\nIf an Event of Default occurs, then, in addition to any other right or remedy that the law provides, we may immediately, or upon notice \nto you if required by law:\n● enforce all or any security over real/immovable property in accordance with the terms of such security; and\n● enforce the security over personal property granted under this Agreement by seizing and taking possession of the collateral and, \nwhether or not we have taken possession, sell or otherwise dispose of the collateral by private or public sale, either for cash or \nupon credit, and appoint a receiver or agent to realize upon or", "page": 7}, {"text": "llateral by private or public sale, either for cash or \nupon credit, and appoint a receiver or agent to realize upon or operate the collateral, provided that we are not responsible for the \nactions of any receiver.\nAll costs and expenses of such enforcement, including legal expenses, will be charged to your loan if you do not pay them.", "page": 7}, {"text": "12421 P-2022/06\nPage 8 of 15\nCIBC Personal Loan: Terms and Conditions\nPart III – Guarantee Term\n25. Guarantee\nIn consideration of CIBC making a loan to the borrower under this Agreement including any future advances, the guarantor agrees that \nhe or she will immediately pay CIBC on demand all amounts owing under this Agreement, including outstanding principal, interest, \ninsurance premiums and any other charges and fees. CIBC will be entitled to demand payment from the guarantor without CIBC first \nhaving to take any legal steps to recover payment from the borrower or any other person.\nYou agree that CIBC may collect information from credit bureaus so long as you remain liable as guarantor. CIBC may also disclose \nInformation to credit bureaus. The word \"Information\" means financial and fi", "page": 8}, {"text": "iable as guarantor. CIBC may also disclose \nInformation to credit bureaus. The word \"Information\" means financial and financially related information about you, including \ninformation to identify you or qualify you for products and services, or information that CIBC needs for regulatory requirements.\n26. Absolute Liability\nThe guarantor’s liability is absolute and unconditional and will not be limited or reduced for any reason, such as:\n● any increase in either the amount of the credit or the interest rate, or any other change in credit;\n● any renewal, extension, replacement or amendment of this Agreement, whether or not the guarantor has consented to such \nrenewal, extension, replacement or amendment;\n● any security granted to CIBC ceasing to be enforceable, in whole or in part, or perfec", "page": 8}, {"text": "sion, replacement or amendment;\n● any security granted to CIBC ceasing to be enforceable, in whole or in part, or perfected;\n● the guarantor’s death or legal incapacity or the death or legal incapacity of the borrowers; or\n● any other event that would constitute a legal or equitable defence to a discharge, limitation or reduction of the guarantor’s \nliability.\nCIBC may debit any account you have with CIBC for any amount that is owed to CIBC under this guarantee. If more than one person is \na guarantor, the obligations of the guarantors are joint and several (in Quebec, solidarily).\n27. Quebec Acknowledgement\nIf the guarantor’s obligations are governed by the laws of Quebec, each guarantor acknowledges that the terms and conditions of the \nobligations of the borrower have been expressly bro", "page": 8}, {"text": "c, each guarantor acknowledges that the terms and conditions of the \nobligations of the borrower have been expressly brought to his or her attention, and each guarantor agrees that if his or her guarantee \nis attached to the performance of special duties, the guarantee will not terminate upon cessation of such duties. The borrower and \nguarantor renounce the benefit of division and discussion.\n28. Continuing Guarantee\nThe guarantor’s liability will continue in effect until such time as all amounts owed by the borrower under this Agreement or any \nrenewal, amendment or extension thereof are repaid in full.\nPart IV – General Terms and Conditions\n29. Certification\nYou certify that the information you have provided to us in the CIBC Personal Loan Borrowing Application and all other documents", "page": 8}, {"text": "y that the information you have provided to us in the CIBC Personal Loan Borrowing Application and all other documents \nrelated to your application for the loan is true.\n30. Changing your Address, other Information or Residency\nYou must immediately notify CIBC of any change to:\n● your address:\n● if you do not, your last known address will be your current address for any purpose under this Agreement. If we are unable \nto deliver any communication or any communication is returned, we may stop attempting to communicate with you until we \nreceive accurate contact information.\n● other information you previously provided to us (including information about your personal financial situation and the value of \nany security you have given us):\n● you will also give us any information and supporting do", "page": 8}, {"text": "l situation and the value of \nany security you have given us):\n● you will also give us any information and supporting documentation that we request or as required by law.\n● your residency. If you are no longer a resident of Canada:\n● we may end this Agreement without your permission; and\n● whether or not we end this Agreement, you will immediately pay all amounts owing under your loan (whether or not such \namounts are then due) free and clear of all foreign taxes and holdbacks. You must pay any withholding taxes.\n31. Estates\nIf more than one borrower signed the CIBC Personal Loan Borrowing Application and if any one of you dies, the survivor(s) must \nimmediately notify us in writing. We are authorized to take such steps or require such documentation (including but not limited to a \ncertifi", "page": 8}, {"text": "in writing. We are authorized to take such steps or require such documentation (including but not limited to a \ncertified copy of the death certificate, a letter or direction, and notarized copy of the letters probate or other court documentation) or \nrestrict transactions related to this Agreement as we deem prudent or advisable.", "page": 8}, {"text": "12421 P-2022/06\nPage 9 of 15\nCIBC Personal Loan: Terms and Conditions\nIf we have not received written notice that a borrower has died, we may execute transactions and deal with this Agreement and the \nloan as though the death had not occurred.\nThe deceased’s estate will remain liable, jointly and severally (in Quebec, solidarily) with the surviving borrowers, for any debit balance \nor other liabilities in connection with this Agreement.\nIf a borrower dies, on request of his or her estate representative, we will provide the estate representative with any documents and \ninformation relating to this Agreement that the deceased would have been entitled to while alive, up to and including the date of \ndeath. This includes, among other things, forms, correspondence, transactions, statements, and", "page": 9}, {"text": "nd including the date of \ndeath. This includes, among other things, forms, correspondence, transactions, statements, and balances.\n32. Power of Attorney or Other Legal Representative during your Lifetime\nYou may appoint someone else to deal with this Agreement and the loan as your agent if you have a duly executed power of attorney, \nin a form acceptable to us. We may require proof or validation, satisfactory to us (including court documents), of such agent’s authority, \nand we may refuse to deal with your agent. You release us from any claim or liability when acting upon the instructions of such agent.\nIf anyone is appointed as guardian of your property (either by statue or by court order), we may require proof or validation, satisfactory \nto us (including court documents) of such guardia", "page": 9}, {"text": "or by court order), we may require proof or validation, satisfactory \nto us (including court documents) of such guardian’s authority.\n33. Independent Legal Advice\nYou will pay the cost of any independent legal advice that you obtain or that we require you to obtain. We may charge these costs to \nyour loan.\n34. Set-Off by CIBC\nIf we owe any obligation to you, we may, without notice to you, set the obligation off against, or compensate the obligation from, any \namount you owe us under this Agreement, no matter how long either amount has been owed.\nIf we receive notice of your bankruptcy, insolvency or similar arrangement, we may immediately exercise this right of set-off or \ncompensation.\nThis right is in addition to any rights we may have at law or in equity to set-off or to compensation.", "page": 9}, {"text": "r \ncompensation.\nThis right is in addition to any rights we may have at law or in equity to set-off or to compensation.\nYou waive any right of set-off or deduction you may have. You must make all payments owing under this Agreement without \ncancelling, reducing, offsetting, compensating, abatement, counterclaiming or deducting, or holding back any amounts.\n35. Events of Default\nYou will be in default under this Agreement if any one or more of the following (each, an “Event of Default”) occurs:\n● you do not pay any amount when due, or do not perform any other obligation, or do not comply with any provisions under this \nAgreement or any security;\n● you do not pay when due any amount that you borrowed from someone other than us;\n● you have, in connection with this Agreement, made a statement", "page": 9}, {"text": "ny amount that you borrowed from someone other than us;\n● you have, in connection with this Agreement, made a statement to us or have provided any information about your financial \nposition that was not true when it was made or provided;\n● you become insolvent or any steps or proceedings are taken by or against you under any bankruptcy or insolvency legislation; and\n● any receiver or custodian or similar person is appointed for you or any of your property.\n36. Remedies upon Default\nUpon the occurrence of an Event of Default, in addition to those remedies that we may exercise to enforce the security, as specified in \nsection 24 above, we may immediately terminate your right to borrow any further funds under your loan and exercise whatever rights \nwe have at law to recover what you owe to us", "page": 9}, {"text": "t to borrow any further funds under your loan and exercise whatever rights \nwe have at law to recover what you owe to us under this Agreement.\n37. How we Apply Payments if you are in Default\nIf you are in default on loan or otherwise in default of this Agreement, we may apply any funds we receive from you or from enforcing \nour rights under this Agreement in any way we see fit, subject to any applicable laws.\n38. Third Party Demands\nWe will comply with any lawful third party demands that we receive in respect of this Agreement or the loan without notice to you.\nAny legal notice or document issued by a third party in respect of this Agreement or the loan will be effectively served if served on us at \na CIBC branch. We may accept service at any other location that we may designate from time", "page": 9}, {"text": "y served if served on us at \na CIBC branch. We may accept service at any other location that we may designate from time to time.\nWe may be required by law to restrict your access to the loan, or re-direct your payments. We will consider any such re-directed \npayments to be missed payments.", "page": 9}, {"text": "12421 P-2022/06\nPage 10 of 15\nCIBC Personal Loan: Terms and Conditions\n39. Indemnity\nYou, your heirs, and your estate representatives indemnify and save harmless us and each of our respective directors, officers, \ncustodians, agents, and employees from and against all liabilities of any nature whatsoever (including all expenses reasonably incurred \nin the defense thereof) that may at any time be incurred by any of us, or be brought against us by any person, legal entity, regulatory \nauthority, or government authority, and that may in any way whatsoever arise out of or be connected in any way with this Agreement. \nIf we are entitled to and make any claim under this indemnity, we may pay the claim from any credit balance on your loan. If there is no \ncredit balance on your loan, you agree to", "page": 10}, {"text": "ty, we may pay the claim from any credit balance on your loan. If there is no \ncredit balance on your loan, you agree to personally pay the amount of the claim and we may apply monies held for you in any other \naccount with CIBC or any affiliate, including joint accounts, other than a registered retirement savings plan or registered retirement \nincome fund, to eliminate or reduce such claim.\n40. Limitation of CIBC’s Liability\nYou understand and agree that, except as otherwise provided for in this Agreement, we will be liable to you only for direct damages \nresulting from our gross negligence, fraud or willful misconduct of CIBC arising directly from our performance of our obligations under \nthis Agreement. We will not be liable to you for any other direct damages.\nWe will not under any cir", "page": 10}, {"text": "obligations under \nthis Agreement. We will not be liable to you for any other direct damages.\nWe will not under any circumstances be liable to you for any other damages, including, without limitation, indirect, incidental, special, \ngeneral, punitive or consequential damages, loss of profits, loss of revenue, loss of business opportunities, inconvenience, or any other \nforeseeable or unforeseeable loss resulting directly or indirectly out of this Agreement or the services provided to you, even if CIBC \nwas advised of the possibility of damages or was negligent. These limitations apply to any act or omission of CIBC, its affiliates, agents \nor suppliers, whether or not the act or omission would otherwise give rise to a cause of action in contract, tort, statute or any other \ndoctrine of la", "page": 10}, {"text": "e act or omission would otherwise give rise to a cause of action in contract, tort, statute or any other \ndoctrine of law. Gross negligence in this paragraph means conduct (whether through action or inaction, or through words or silence) \nwhich is:\n● a marked and flagrant departure from the conduct ordinarily expected of a reasonable and prudent person in the position of \nCIBC; or\n● so wanton and reckless as to constitute an utter disregard for harmful, foreseeable and avoidable consequences.\n41. Severability\nIf any part of this Agreement is determined by any court of competent jurisdiction to be illegal, unenforceable or invalid, that part will \nbe severed from this Agreement and the remaining parts of the Agreement will continue in full force and effect.\n42. Conflict\nIf there is a confli", "page": 10}, {"text": "ement and the remaining parts of the Agreement will continue in full force and effect.\n42. Conflict\nIf there is a conflict or inconsistency between the terms of this Agreement and the terms of any other agreement or document we \nhave with you related to this Agreement including our mortgage/charge, the provisions of this Agreement will prevail. However, it will \nnot be considered a conflict or an inconsistency if our mortgage/charge contains additional terms, conditions or provisions (including \nany rights, remedies, covenants, representations or warranties) that are not included in this Agreement. Any such terms, conditions or \nprovisions will remain in effect.\n43. Binding Effect\nThis Agreement is binding on us and our successors and assigns. It is also binding on you, your heirs, your es", "page": 10}, {"text": "ng Effect\nThis Agreement is binding on us and our successors and assigns. It is also binding on you, your heirs, your estate and your personal and \nlegal representatives, including your executors, administrators and successors and any person to whom it is assigned with our consent.\n44. Waiver of Terms\nOnly an authorized officer of CIBC can waive a term of this Agreement or our mortgage/charge, and the waiver must be in writing. If \nwe fail to exercise, or if we delay exercising, any of our rights under this Agreement or our mortgage/charge, this will not be a waiver of \nour rights and will not prevent us from exercising these rights again in the future. If we waive a breach of any term of this Agreement \nor our mortgage/charge, it does not mean we are waiving the term itself.\n45. Governing", "page": 10}, {"text": "ch of any term of this Agreement \nor our mortgage/charge, it does not mean we are waiving the term itself.\n45. Governing Law\nThis Agreement is governed by and interpreted in accordance with the laws of the province or territory where you reside and the \napplicable laws of Canada. You agree to submit to and be bound by those laws and the courts of that province/territory in the event \nof any dispute relating to this Agreement or our mortgage/charge. Any judgment we obtain will not affect your obligations under this \nAgreement or our mortgage/charge.\n46. Extensions of Limitations Period\nWhere permitted by provincial or territorial law, the limitation period for this Agreement is extended to six years.\n47. Privacy\nYou consent to the collection, use and sharing of your personal information fro", "page": 10}, {"text": "nt is extended to six years.\n47. Privacy\nYou c <script>
/* ===================== TF-IDF RETRIEVAL (local, no external embedding API) ===================== */
const STOP = new Set("a an the of to in on for and or is are was were be been being this that these those it its as at by from with your you i we our my his her their not no do does did can could should would will shall may might must have has had".split(" "));

function tokenize(s){
  return (s.toLowerCase().match(/[a-z0-9%.]+/g) || []).filter(w => w.length>1 && !STOP.has(w));
}

function buildIndex(chunks){
  const docsTokens = chunks.map(c => tokenize(c.text));
  const df = new Map();
  docsTokens.forEach(tokens => {
    new Set(tokens).forEach(t => df.set(t, (df.get(t)||0)+1));
  });
  const N = chunks.length;
  const idf = new Map();
  df.forEach((v,k) => idf.set(k, Math.log((N+1)/(v+0.5))+1));

  const vectors = docsTokens.map(tokens => {
    const tf = new Map();
    tokens.forEach(t => tf.set(t, (tf.get(t)||0)+1));
    const vec = new Map();
    let norm = 0;
    tf.forEach((freq,term) => {
      const w = (freq/tokens.length) * (idf.get(term)||0);
      vec.set(term, w);
      norm += w*w;
    });
    norm = Math.sqrt(norm) || 1;
    return {vec, norm};
  });
  return {vectors, idf};
}

function searchChunks(question, chunks, index, k=5){
  const qTokens = tokenize(question);
  const qtf = new Map();
  qTokens.forEach(t => qtf.set(t, (qtf.get(t)||0)+1));
  const qvec = new Map();
  let qnorm = 0;
  qtf.forEach((freq,term) => {
    const w = (freq/(qTokens.length||1)) * (index.idf.get(term)||0);
    qvec.set(term, w);
    qnorm += w*w;
  });
  qnorm = Math.sqrt(qnorm) || 1;

  const scores = chunks.map((c,i) => {
    const {vec, norm} = index.vectors[i];
    let dot = 0;
    qvec.forEach((w,term) => { if(vec.has(term)) dot += w*vec.get(term); });
    const score = dot / (qnorm*norm);
    return {i, score};
  });
  scores.sort((a,b) => b.score-a.score);
  return scores.slice(0,k).filter(s=>s.score>0).map(s => ({...chunks[s.i], score:s.score}));
}

/* ===================== CLAUDE API CALL ===================== */
async function claude(prompt, maxTokens=400){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:maxTokens,
      messages:[{role:"user", content: prompt}]
    })
  });
  const data = await res.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text);
  return textBlocks.join("\n").trim();
}

function scopeDesc(doc){
  return `the terms and conditions of the ${doc.bank} (${doc.country}) personal loan / credit product uploaded here: interest rate, fees, repayment schedule, penalties, eligibility, collateral, and what the contract does or does not include`;
}

async function guardStep(question, doc){
  const prompt = `You are a strict topic gate for a bank Loan-Terms assistant.
The assistant may ONLY answer questions about: ${scopeDesc(doc)}.

Decide if the user's question is INSIDE that topic.
Reply with exactly one word: ALLOW or REFUSE.

Rules:
- Advice or opinions ("should I take this loan?", "is this a good deal?") -> REFUSE.
- General knowledge, jokes, coding, other companies, other banks -> REFUSE.
- Only factual questions about THIS product's own terms -> ALLOW.

User question: ${question}
Answer (ALLOW or REFUSE):`;
  const out = (await claude(prompt, 5)).toUpperCase();
  return out.includes("ALLOW");
}

async function answerStep(question, chunks){
  const context = chunks.map(c => `[p. ${c.page}] ${c.text}`).join("\n\n");
  const prompt = `You answer questions about a bank loan's Terms & Conditions.
Use ONLY the context below. Do not use outside knowledge, and do not guess.

If the answer is NOT clearly in the context, reply exactly:
"Not stated in the terms."

When you do answer: be concise (2-4 sentences), quote the exact number/fee/rule, and add the page in the form (p. X) right after the fact it supports.

Context:
${context}

Question: ${question}
Answer:`;
  return await claude(prompt, 500);
}

async function verifyStep(answer, chunks){
  const context = chunks.map(c => c.text).join("\n\n");
  const prompt = `Check if the ANSWER is fully supported by the CONTEXT.
Reply with exactly one word: GROUNDED or NOT_GROUNDED.
An answer that says "Not stated in the terms." is always GROUNDED.

CONTEXT:
${context}

ANSWER:
${answer}

Verdict:`;
  const out = (await claude(prompt, 5)).toUpperCase();
  return !out.includes("NOT_GROUNDED");
}

    let cls = "pstep";
    if(blockedAt!==null && i===blockedAt) cls += " blocked";
    else if(i<stepIndex || (blockedAt!==null && i<blockedAt)) cls += " done";
    else if(i===stepIndex && blockedAt===null) cls += " active";
    return `<div class="${cls}"><span class="dot"></span>${s}</div>` + (i<3?`<div class="pline"></div>`:"");
  }).join("");
  chatInner.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || sending) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  inputEl.style.height="auto";

  chatState[currentDoc].push({role:"user", text});
  renderMessages();
  scrollToBottom();

  const doc = DATA[currentDoc];
  const pipelineEl = renderPipeline(0);

  try{
    // STEP 1
    const inScope = await guardStep(text, doc);
    if(!inScope){
      renderPipeline(0, 0);
      await sleep(250);
      chatState[currentDoc].push({role:"assistant", status:"refused",
        text:"I can only answer questions about this loan product's terms and conditions."});
      renderMessages();
      scrollToBottom();
      return;
    }

    // STEP 2
    renderPipeline(1);
    const index = getIndex(currentDoc);
    const chunks = searchChunks(text, doc.chunks, index, 5);
    await sleep(150);

    // STEP 3
    renderPipeline(2);
    const draft = await answerStep(text, chunks);

    // STEP 4
    renderPipeline(3);
    const grounded = await verifyStep(draft, chunks);

    if(!grounded){
      renderPipeline(3,3);
      await sleep(200);
      chatState[currentDoc].push({role:"assistant", status:"blocked",
        text:"I can't confirm this from the document.", sources: chunks});
      renderMessages();
      scrollToBottom();
      return;
    }

    const pageMatches = [...draft.matchAll(/p\.\s?(\d+)/g)].map(m=>m[1]);
    const citations = pageMatches.length ? pageMatches : [...new Set(chunks.slice(0,2).map(c=>c.page))];

    chatState[currentDoc].push({role:"assistant", status:"grounded",
      text:draft, citations, sources: chunks});
    renderMessages();
    scrollToBottom();

  } catch(err){
    chatState[currentDoc].push({role:"assistant", status:"blocked",
      text:"Something went wrong reaching the model. Please try again."});
    renderMessages();
  } finally {
    const p = chatInner.querySelector(".pipeline");
    if(p) p.remove();
    sending = false;
    sendBtn.disabled = false;
  }
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function renderAll(){
  renderSidebar();
  renderBanner();
  renderMessages();
  scrollToBottom();
}

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});
inputEl.addEventListener("keydown", e => {
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener("click", sendMessage);
el("#menuBtn").addEventListener("click", () => sidebarEl.classList.toggle("open"));

renderAll();

</script>
